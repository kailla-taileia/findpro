<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <title>Profissionais | FindPro</title>

    <link rel="stylesheet" href="/frontend/css/root.css">

<body>
    <header class="navbar">
        <div class="logo">
            <a href="/frontend/index.html">Find<span>Pro</span></a>
